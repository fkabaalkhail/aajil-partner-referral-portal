services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aajil_referral
      POSTGRES_USER: aajil
      POSTGRES_PASSWORD: aajil_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aajil -d aajil_referral"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://aajil:aajil_dev@db:5432/aajil_referral
      JWT_SECRET: dev-secret-change-in-prod
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/index.js"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
